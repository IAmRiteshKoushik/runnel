[package]
name = "runnel"
version = "0.1.0"
edition = "2024"
default-run = "runnel"

[[bin]]
name = "loggen"
path = "src/bin/http-workload/main.rs"
required-features = ["workload"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"], optional = true }
config = { version = "0.15.27", default-features = false, features = ["toml"] }
fake = { version = "5.1.0", optional = true }
lapin = "4.12.3"
rand = { version = "0.10.3", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }

[features]
workload = ["dep:clap", "dep:fake", "dep:rand"]
