# Keep formatting aligned with the crate's Rust edition.
edition = "2024"
style_edition = "2024"

# Line width, indentation, and line endings.
max_width = 80
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"

# Keep imports and module declarations ordered.
reorder_imports = true
reorder_modules = true

# Prefer idiomatic shorthand where rustfmt can apply it.
use_field_init_shorthand = true
use_try_shorthand = true
